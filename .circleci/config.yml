# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  # Below is the definition of your job to build and test your app, you can rename and customize it as you want.
  build-and-test:
    # These next lines define a Docker executor: https://circleci.com/docs/2.0/executor-types/
    # You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # Be sure to update the Docker image tag below to openjdk version of your application.
    # A list of available CircleCI Docker Convenience Images are available here: https://circleci.com/developer/images/image/cimg/openjdk
    docker:
      - image: cimg/openjdk:25.0
    resource_class: large
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps
    steps:
      # Checkout the code as the first step.
      - checkout
      # Use mvn clean and package as the standard maven build phase
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      # Then run your tests! verify (not just test) so ld-validation's jacoco:report
      # execution -- bound to the verify phase -- actually runs and produces a coverage
      # report; reporting only, doesn't fail the build on a coverage number.
      - run:
          name: Test
          command: mvn verify
      - store_artifacts:
          path: ld-validation/target/site/jacoco
          destination: coverage/ld-validation

  # Builds the ld-service image and waits for its HEALTHCHECK to pass, so a stale Dockerfile
  # (the old one pointed at a long-gone jar name and a Java 8 base) fails a PR instead of rotting
  # unnoticed. Nothing is pushed anywhere.
  docker-image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build ld-service image
          command: docker build -f ld-service/Dockerfile -t ld-service:ci .
      - run:
          name: Wait for the container to report healthy
          command: |
            docker run -d --name ld-service-ci ld-service:ci
            for i in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' ld-service-ci)
              echo "health: $status"
              [ "$status" = healthy ] && exit 0
              sleep 5
            done
            docker logs ld-service-ci
            exit 1

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  sample: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - build-and-test
      - docker-image
